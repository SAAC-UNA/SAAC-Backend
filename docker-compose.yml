# ========================================
# Docker Compose - SAAC Backend
# ========================================
# Servicios para desarrollo:
# - OpenLDAP: Servidor de autenticación (puerto 389/636)
# - Redis: Almacenamiento de sesiones (puerto 6379)
#
# Comandos útiles:
#   docker compose up -d      → Inicia los servicios en segundo plano
#   docker compose down       → Detiene y elimina los contenedores
#   docker compose ps         → Lista los contenedores corriendo
#   docker compose logs       → Ver logs de todos los servicios
#   docker compose logs ldap  → Ver logs solo de LDAP
# ========================================

version: '3.8'

services:
  # ========================================
  # Servicio 1: OpenLDAP
  # ========================================
  # Servidor LDAP para autenticación de usuarios
  # Base DN: dc=una,dc=local
  # Usuario admin: cn=admin,dc=una,dc=local
  # Contraseña: admin
  openldap:
    image: osixia/openldap:1.5.0
    container_name: saac_openldap
    hostname: ldap.una.local
    environment:
      # Nombre de la organización (UNA - Universidad Nacional)
      - LDAP_ORGANISATION=UNA
      
      # Dominio LDAP (se convierte en dc=una,dc=local)
      - LDAP_DOMAIN=una.local
      
      # Contraseña del usuario administrador
      - LDAP_ADMIN_PASSWORD=admin
      
      # Habilitar SSL/TLS (puerto 636)
      - LDAP_TLS=true
      
      # Desactivar verificación de certificados SSL (solo desarrollo)
      - LDAP_TLS_VERIFY_CLIENT=never
      
      # Nivel de log (256 = conexiones y operaciones)
      - LDAP_LOG_LEVEL=256
    
    ports:
      # Puerto 389: LDAP sin cifrado (desarrollo)
      - "389:389"
      
      # Puerto 636: LDAPS con cifrado SSL/TLS
      - "636:636"
    
    volumes:
      # Volumen para base de datos LDAP (datos de usuarios)
      - ldap_data:/var/lib/ldap
      
      # Volumen para configuración del servidor LDAP
      - ldap_config:/etc/ldap/slapd.d
    
    networks:
      - saac
    
    # Reiniciar automáticamente si el contenedor falla
    restart: unless-stopped
    
    # Chequeo de salud: verifica que el servicio LDAP responda
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://localhost", "-b", "dc=una,dc=local", "-LLL"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ========================================
  # Servicio 2: Redis
  # ========================================
  # Servidor Redis para almacenamiento de sesiones
  # Puerto: 6379
  # Sin contraseña (solo desarrollo local)
  redis:
    image: redis:7-alpine
    container_name: saac_redis
    hostname: redis.una.local
    
    ports:
      # Puerto 6379: Redis estándar
      - "6379:6379"
    
    volumes:
      # Volumen para persistencia de datos de Redis
      - redis_data:/data
    
    # Comando de inicio con persistencia habilitada (AOF)
    command: redis-server --appendonly yes
    
    networks:
      - saac
    
    # Reiniciar automáticamente si el contenedor falla
    restart: unless-stopped
    
    # Chequeo de salud: verifica que Redis responda
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# ========================================
# Volúmenes
# ========================================
# Almacenamiento persistente (los datos NO se pierden al hacer docker compose down)
volumes:
  # Datos de la base de datos LDAP (usuarios, grupos, etc.)
  ldap_data:
    driver: local
  
  # Configuración del servidor LDAP
  ldap_config:
    driver: local
  
  # Datos de Redis (sesiones de usuario)
  redis_data:
    driver: local

# ========================================
# Redes
# ========================================
# Red interna para comunicación entre contenedores
networks:
  saac:
    driver: bridge
    name: saac_network
version: '3.8'

services:
  # OpenLDAP - Servidor de autenticación
  ldap:
    image: osixia/openldap:latest
    container_name: saac_ldap
    environment:
      LDAP_ORGANISATION: "SAAC UNA"
      LDAP_DOMAIN: "saac.una.cr"
      LDAP_ADMIN_PASSWORD: "admin123"
      LDAP_CONFIG_PASSWORD: "config123"
      LDAP_TLS: "false"
      LDAP_READONLY_USER: "false"
    ports:
      - "389:389"   # LDAP
      - "636:636"   # LDAPS (SSL)
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
    networks:
      - saac

  # Redis - Gestión de sesiones
  redis:
    image: redis:latest
    container_name: saac_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - saac

  # PhpLDAPAdmin - Interfaz web para gestionar LDAP (opcional)
  phpldapadmin:
    image: osixia/phpldapadmin:latest
    container_name: saac_phpldapadmin
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: "ldap"
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "8081:80"
    depends_on:
      - ldap
    networks:
      - saac

volumes:
  ldap_data:
  ldap_config:
  redis_data:

networks:
  saac:
    driver: bridge
  # MySQL - Reemplaza XAMPP
  mysql:
    image: mysql:8.0
    container_name: saac_mysql
    restart: unless-stopped
    ports:
      - "3307:3306"  # Puerto 3307 en host (igual que tu XAMPP)
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: saac_una
      MYSQL_USER: saac_user
      MYSQL_PASSWORD: saac_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - saac_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Para sesiones
  redis:
    image: redis:7-alpine
    container_name: saac_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - saac_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # OpenLDAP - Para autenticación
  openldap:
    image: osixia/openldap:1.5.0
    container_name: saac_openldap
    restart: unless-stopped
    ports:
      - "1389:389"   # Cambiado a 1389 para evitar conflicto
      - "1636:636"   # Cambiado a 1636
    environment:
      LDAP_ORGANISATION: "Universidad Nacional"
      LDAP_DOMAIN: "una.local"
      LDAP_ADMIN_PASSWORD: "admin"
      LDAP_CONFIG_PASSWORD: "config"
      LDAP_RFC2307BIS_SCHEMA: "false"
      LDAP_BACKEND: "mdb"
      LDAP_TLS: "true"
      LDAP_TLS_CRT_FILENAME: "ldap.crt"
      LDAP_TLS_KEY_FILENAME: "ldap.key"
      LDAP_TLS_DH_PARAM_FILENAME: "dhparam.pem"
      LDAP_TLS_CA_CRT_FILENAME: "ca.crt"
      LDAP_TLS_ENFORCE: "false"
      LDAP_TLS_CIPHER_SUITE: "SECURE256:-VERS-SSL3.0"
      LDAP_TLS_VERIFY_CLIENT: "demand"
      LDAP_REPLICATION: "false"
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "true"
      LDAP_SSL_HELPER_PREFIX: "ldap"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
    networks:
      - saac_network
    healthcheck:
      test: ["CMD", "ldapsearch", "-x", "-H", "ldap://localhost", "-b", "dc=una,dc=local"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  saac_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  ldap_data:
    driver: local
  ldap_config:
    driver: local
